<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SLG Strategy</title>
<style>
  :root { --navy:#0d2f4f; --blue:#0672CB; --mut:#5b6b7a; --line:#dde4ec; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 "Segoe UI",Roboto,Arial,sans-serif; color:#15222e;
         background:#f5f7fa; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  main { max-width:560px; padding:40px 24px; }
  h1 { color:var(--navy); font-size:1.7rem; margin:0 0 4px; }
  p.tag { color:var(--mut); margin:0 0 28px; }
  a.card { display:block; background:#fff; border:1px solid var(--line); border-radius:10px;
           padding:16px 20px; margin:12px 0; text-decoration:none; color:inherit; }
  a.card:hover { border-color:var(--blue); box-shadow:0 2px 10px rgba(6,114,203,.12); }
  a.card b { color:var(--blue); display:block; margin-bottom:2px; }
  a.card span { font-size:.9rem; color:var(--mut); }
  footer { margin-top:32px; font-size:.78rem; color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>SLG Strategy</h1>
  <p class="tag">State &amp; Local Government field strategy resources.</p>

  <!-- During migration these point at the current host; swap to /campaigns/ and
       /analysis/ root-relative paths once those repos move to this account. -->
  <a class="card" href="https://dell-strategy.github.io/campaigns/home.html">
    <b>Campaigns Hub</b>
    <span>Initiatives, briefs, and campaign artifacts</span>
  </a>
  <a class="card" href="https://dell-strategy.github.io/analysis/index.html">
    <b>State Analysis</b>
    <span>State-by-state reports: budget, procurement, power structure</span>
  </a>

  <footer>Internal working resources &middot; not an official Dell Technologies site.</footer>
</main>
</body>
</html>
